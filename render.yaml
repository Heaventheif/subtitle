services:
  - type: web
    name: subtitle-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_TOKEN
        generateValue: true
      - key: OPENSUBTITLES_ACCOUNTS
        sync: false
      - key: OPENSUBTITLES_DAILY_LIMIT
        value: "200"
      - key: SUBDL_API_KEYS
        sync: false
      - key: SUBDL_DAILY_LIMIT
        value: "500"
      # مهلة البحث الصارمة (ms) — الرد الجزئي أفضل من الرد البطيء
      - key: SEARCH_TIMEOUT_MS
        value: "6000"
      - key: DB_PATH
        value: "data/cache.db"
      # RENDER_EXTERNAL_URL يحقنه Render تلقائياً ويُستخدم للنبض الذاتي
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "600000"
